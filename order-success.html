<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | Sunkara LTD</title>
  <meta name="description" content="Your order with Sunkara LTD has been confirmed. View order receipt, items summary, and delivery tracking.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Site Header -->
  <header class="site-header">
    <div class="container">
      <div class="header-inner">
        <a href="index.html" class="brand-logo">
          <div class="brand-icon"><i class="fa-solid fa-bolt"></i></div>
          <span class="brand-text">Sunkara <span>LTD</span></span>
        </a>

        <div style="font-size: 0.875rem; font-weight: 600; color: var(--success); display: flex; align-items: center; gap: 0.5rem;">
          <i class="fa-solid fa-circle-check"></i> Transaction Approved
        </div>

        <div class="header-actions">
          <a href="shop.html" class="btn btn-outline btn-sm">Shop More</a>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="order-success-card" id="order-success-container">
      <!-- Populated via JS -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <div>&copy; 2026 Sunkara LTD. All rights reserved.</div>
        <div class="footer-payment-icons">
          <span>Official Order Invoice</span>
          <span>·</span>
          <span>Verified Transaction</span>
        </div>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const container = document.getElementById('order-success-container');
      const orderRaw = localStorage.getItem(STORAGE_KEYS.LAST_ORDER);

      let order = null;
      if (orderRaw) {
        try {
          order = JSON.parse(orderRaw);
        } catch (e) {
          order = null;
        }
      }

      // If visited directly without an order, generate a sample order so user sees the full UI
      if (!order) {
        order = {
          orderId: generateOrderId(),
          createdAt: new Date().toISOString(),
          customer: {
            name: "Oliver Bennett",
            email: "oliver.bennett@sunkaraltd.co.uk",
            phone: "07700 900123",
            address: "61 Albion Road",
            city: "Hounslow",
            state: "Greater London",
            pin: "TW3 3RS"
          },
          paymentMethod: "Debit / Credit Card",

          paymentStatus: "PAYMENT SUCCESSFUL",
          items: [
            {
              name: PRODUCTS[0].name,
              price: PRODUCTS[0].price,
              quantity: 1,
              image: PRODUCTS[0].image
            },
            {
              name: PRODUCTS[2].name,
              price: PRODUCTS[2].price,
              quantity: 2,
              image: PRODUCTS[2].image
            }
          ],
          totals: calculateOrderTotals(
            [
              { productId: PRODUCTS[0].id, quantity: 1 },
              { productId: PRODUCTS[2].id, quantity: 2 }
            ],
            'SUNKARA10'
          )
        };
      }

      const formattedDate = new Date(order.createdAt).toLocaleDateString('en-GB', {
        day: 'numeric',
        month: 'short',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      // Render Order Confirmation
      container.innerHTML = `
        <div class="success-check-circle">
          <i class="fa-solid fa-check"></i>
        </div>

        <div style="display: inline-block; background: var(--success-bg); color: var(--success); font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.75rem; border-radius: var(--radius-full); margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;">
          <i class="fa-solid fa-circle-check"></i> ${order.paymentStatus}
        </div>

        <h1 style="font-size: 2rem; font-weight: 800; color: var(--secondary); letter-spacing: -0.02em;">
          Thank You For Your Order!
        </h1>

        <p style="color: var(--text-muted); font-size: 0.9375rem; margin-top: 0.5rem; max-width: 540px; margin-left: auto; margin-right: auto;">
          We've received your order and our technical logistics team has queued your components for automated ESD inspection and express packing.
        </p>

        <!-- Printable Receipt Box -->
        <div class="receipt-box">
          <div class="receipt-header">
            <div>
              <div style="font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; font-weight: 700;">Order Reference</div>
              <div class="receipt-id">${order.orderId}</div>
            </div>
            <div style="text-align: right;">
              <div style="font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; font-weight: 700;">Date & Time</div>
              <div style="font-size: 0.875rem; font-weight: 600; color: var(--secondary);">${formattedDate}</div>
            </div>
          </div>

          <!-- Customer & Delivery Row -->
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--surface-border); margin-bottom: 1rem;">
            <div>
              <div style="font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; font-weight: 700;">Delivering To</div>
              <div style="font-size: 0.875rem; font-weight: 700; color: var(--secondary); margin-top: 0.2rem;">${order.customer.name}</div>
              <div style="font-size: 0.8125rem; color: var(--text-muted); line-height: 1.4;">
                ${order.customer.address}, ${order.customer.city}, ${order.customer.state}, ${order.customer.pin}
              </div>
              <div style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.2rem;">
                <i class="fa-solid fa-phone" style="font-size: 0.7rem;"></i> ${order.customer.phone}
              </div>
            </div>

            <div>
              <div style="font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; font-weight: 700;">Payment Summary</div>
              <div style="font-size: 0.875rem; font-weight: 700; color: var(--secondary); margin-top: 0.2rem;">
                Method: ${order.paymentMethod}
              </div>
              <div style="font-size: 0.8125rem; color: var(--success); font-weight: 600; margin-top: 0.2rem;">
                <i class="fa-solid fa-shield-halved"></i> 256-Bit SSL Secure Authorization
              </div>
              <div style="font-size: 0.8125rem; color: var(--text-muted); margin-top: 0.2rem;">
                Est. Delivery: <strong>1 - 3 working days</strong>
              </div>
            </div>
          </div>

          <!-- Items Breakdown -->
          <div class="receipt-items-list">
            <div style="font-size: 0.75rem; color: var(--text-light); text-transform: uppercase; font-weight: 700; margin-bottom: 0.25rem;">
              Items Purchased (${order.items.reduce((s, i) => s + i.quantity, 0)})
            </div>
            ${order.items.map(item => `
              <div class="receipt-item-row">
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                  <span style="font-weight: 600; color: var(--secondary);">${item.name}</span>
                  <span style="color: var(--text-muted); font-size: 0.8125rem;">(Qty: ${item.quantity})</span>
                </div>
                <span class="tabular-nums font-semibold">${formatGBP(item.price * item.quantity)}</span>
              </div>
            `).join('')}
          </div>

          <!-- Total Calculation -->
          <div style="padding-top: 1rem; display: flex; flex-direction: column; gap: 0.4rem; font-size: 0.875rem;">
            <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
              <span>Subtotal</span>
              <span class="tabular-nums font-semibold">${formatGBP(order.totals.subtotal)}</span>
            </div>
            ${order.totals.discount > 0 ? `
              <div style="display: flex; justify-content: space-between; color: var(--success);">
                <span>Discount</span>
                <span class="tabular-nums font-semibold">-${formatGBP(order.totals.discount)}</span>
              </div>
            ` : ''}
            <div style="display: flex; justify-content: space-between; color: var(--text-muted);">
              <span>Shipping Charge</span>
              <span class="tabular-nums font-semibold">${order.totals.shipping === 0 ? '<span style="color: var(--success);">FREE</span>' : formatGBP(order.totals.shipping)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; color: var(--text-light); font-size: 0.75rem;">
              <span>VAT Included</span>
              <span class="tabular-nums">${formatGBP(order.totals.vatAmount)}</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 1.25rem; font-weight: 800; color: var(--secondary); border-top: 1px dashed var(--surface-border); padding-top: 0.75rem; margin-top: 0.5rem;">
              <span>Total Paid</span>
              <span class="tabular-nums" style="color: var(--primary);">${formatGBP(order.totals.total)}</span>
            </div>
          </div>
        </div>

        <!-- Action Buttons -->
        <div style="display: flex; justify-content: center; gap: 1rem; flex-wrap: wrap;">
          <button class="btn btn-primary" onclick="window.print()">
            <i class="fa-solid fa-print"></i> Print Official Receipt
          </button>
          <a href="shop.html" class="btn btn-outline">
            <i class="fa-solid fa-arrow-left"></i> Continue Shopping
          </a>
        </div>
      `;
    });
  </script>
</body>
</html>
